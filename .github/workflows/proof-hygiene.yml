# Proof-hygiene gate for the PolarFire AMP fork.
#
# Runs the l4v-only, self-contained tier of the merge gate on every pull request
# into a mainline branch: no cheats (sorry/oops/quick_and_dirty/skip_proofs)
# anywhere in l4v/amp, and a preceding prose comment on every declaration there
# (coding standard, CLAUDE.md). Scope is the fixed l4v/amp/ directory, not a
# diff against the PR base -- see check-hygiene.sh's header for why.
#
# This tier is fast (seconds) and needs no kernel build or Isabelle, so it is
# safe to run in CI. The heavy checks -- build config, generated maxIRQ/irqBits,
# and the ~25-minute Isabelle session build -- are NOT run here; they are
# attested by a human in the commit's "Verified:" trailer (see CONTRIBUTING.md).
#
# To make this a genuine block, enable branch protection on `polarfire` in the
# fork's GitHub settings and mark this check "Required". Actions may also need
# to be enabled once in the fork (Settings -> Actions), since this is a fork.

name: proof-hygiene

on:
  pull_request:
    branches: [polarfire]
  workflow_dispatch: {}

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Run hygiene checks against l4v/amp
        run: |
          chmod +x .github/scripts/check-hygiene.sh
          .github/scripts/check-hygiene.sh
